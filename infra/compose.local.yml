name: iac-asset-platform
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: iac_local
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run npm run setup:local first}
      POSTGRES_DB: iac_dev
    ports: ["127.0.0.1:${DB_PORT:-55432}:5432"]
    volumes: ["iac_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iac_local -d iac_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  iac_pg:
